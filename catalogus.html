 function researchExtendedPage(c){

 const cover=(src,description)=>src?`<img loading="lazy" src="${esc(src)}" alt="${esc(description)}">`:`<div class="edition-image" role="img" aria-label="${label('Portada ainda no disponible','Cover not yet available')}"><span>▤</span><small>${label('Portada por agregá','Cover to be added')}</small></div>`;
 const rIntro=`<p class="source-warning">${label('E datonan di obra, edishon i referensia den e website ta provisional. Estadístika definitivo di total di obra i total di buku ta den preparashon.','Work, edition and citation data on this site are provisional. Final totals for distinct works and published book units are still being validated.')}</p>`;
 const publicationCards=(d.publicationForms||[]).map(w=>`<article class="publication-item"><h3>${esc(w.work)}</h3><div class="publication-forms">${(w.forms||[]).map(f=>`<div class="publication-form">${cover((d.coverImages||{})[w.work+'|'+f.label],f.label)}<strong>${esc(f.label)}</strong><small>${esc(f.parts)} ${label('parte / tomo segun fuente','part(s) / volume(s) per source')}</small></div>`).join('')}</div><p class="muted small">${esc(w.note||'')}</p></article>`).join('');
 const gapCards=(d.seriesGaps||[]).map(x=>`<article class="publication-item"><h3>${esc(x.series)}</h3><div class="volume-strip">${Array.from({length:x.max},(_,i)=>i+1).map(n=>`<span class="volume ${x.gaps.includes(n)?'gap':'registered'}" title="${x.gaps.includes(n)?label('No registrá','Not recorded'):label('Registrá','Recorded')}">${n}<small>${x.gaps.includes(n)?'?':'✓'}</small></span>`).join('')}</div><p class="small muted">${label('E signonan di pregunta ta indiká un hiaat den e registrashon; no ta prueba di publikashon.','Question marks indicate a gap in the records, not proof a volume was published.')}</p></article>`).join('');
 const connections=(d.storyLinks||[]).map(x=>`<div class="connection-row"><span>${esc(x.from)}</span><strong>${x.type==='adaptation'?label('Adaptashon →','Adaptation →'):label('Kontinuashon →','Sequel →')}</strong><span>${esc(x.to)}</span></div>`).join('');

 const countCards=`<div class="research-stats">${[
 ['—',label('Obra original distinto','Distinct original works')],['—',label('Buki / tomo produsí','Book units / volumes produced')],['—',label('Edishon i reimpreshon','Editions and reprints')],['—',label('Total di tomo ku falta','Total missing volume numbers')]
 ].map(([n,t])=>`<div class="research-stat"><strong>${n}</strong><span>${t}</span></div>`).join('')}</div>`;
 const dashboard=block('production',label('Obra den sifra','Literary output in numbers'),rIntro+countCards+p('E muestra ta inkluí '+b.length+' grupo provisional di título; esaki no ta e total definitivo di obra ni volumen di buki.', 'The sample contains '+b.length+' provisional title groupings. This is not the final number of works or published volumes.'));
 const publication=block('editions',label('Seri, edishon i reimpreshon','Series, editions and reprints'),p('Un mes obra por tin mas ku un forma di publikashon. E foto di kada vershon lo wordu agregá despues di kontrol.','A work may have multiple publication configurations. Photographs of each version can be added once checked.')+publicationCards);
 const gaps=block('gaps',label('Partinan ku falta','Missing parts in the records'),gapCards);

 const awards=block('awards',label('Premio, rekonosementu i homenahe','Awards, recognition and tributes'),p('E dokumento di investigashon ta menshoná e siguiente rekonosementunan. Detayenan di e premionan i nan motibu ofisial ainda mester verifiká.','The research document lists the following recognitions. Official award descriptions and supporting records still require checking.')+'<ul>'+window.EDITORIAL_DATA.awards.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'+list(d.awards||[]));
 const about=block('about-publications',label('Publikashonnan tokante Ortega','Publications about Ortega'),p('Artíkulo, buki, resenshon, trabou akademiko i e otro fuentenan ku ta diskuti su obra.','Articles, books, reviews, scholarship and other sources discussing his work.')+list(d.publicationsAbout||[]));
 const literature=block('consulted',label('Literatura konsultá','Research literature consulted'),p('E lista aki ta pa fuente konsultá pa e investigashon aki. E no ta meskos ku e bibliografia di su obra.','This is the list of literature consulted for the current study, separate from the bibliography of his own publications.')+'<ul class="bibliography-references">'+window.EDITORIAL_DATA.references.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'+list(d.consultedLiterature||[]));
 const voices=block('community',label('Memoria di pueblo','Community memories'),p('Ya a realisá konversashonnan eksploratorio. Un siguiente fase lo aprofundisá ku mas entrevista, ku permiso di e partisipantenan.','Exploratory conversations have already taken place. A next phase will deepen the work through further interviews, with participants’ permission.')+list(d.communityInterviews||[]));
 const music=block('music-research',label('Músika — investigashon en progreso','Music — research in progress'),p('E material ku ta dokumentá letra, kantika i komposishon ta limitá. Nos ta reservá e seccion pa prueba ku lo bin.','Documentation of lyrics, songs and compositions is currently limited. The section is reserved for future verified evidence.')+list(d.music||[]));

 // Use distinct hash routes for section jumps to avoid the site's hash router intercepting anchors.
 return `${heading(c.research.kicker,c.research.title,c.research.lead)}<section class="section container research-page expanded-research">${toc}${dashboard}${publication}${gaps}${links}${voices}${awards}${about}${literature}${music}${methodology}<p class="muted small">${label('Papiamentu provisional — pa revisá editorialmente.','Papiamentu copy is provisional, pending editorial review.')}</p></section>`;

 function render(){const c=window.SITE_CONTENT[lang];document.documentElement.lang=lang;const route=getRoute();const nav=document.getElementById('navigation');window.WilfridoNavigation.update(route,lang);document.getElementById('page').innerHTML=renderPage(route,c);if(route==='bibliography')initBibliography();if(route==='distribution')initDistribution();if(route==='research')document.querySelectorAll('.research-toc a').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();const target=document.getElementById(a.dataset.local);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});}));document.getElementById('footer-copy').textContent=c.common.inDevelopment;document.getElementById('lang-pap').setAttribute('aria-pressed',String(lang==='pap'));document.getElementById('lang-en').setAttribute('aria-pressed',String(lang==='en'));document.getElementById('year').textContent=new Date().getFullYear();document.title=(route==='home'?'Wilfrido Ortega':(c.nav[route]||c.topics[route]?.title||'Wilfrido Ortega')+' | Wilfrido Ortega');nav.classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false')}
 document.getElementById('lang-pap').addEventListener('click',()=>setLang('pap'));document.getElementById('lang-en').addEventListener('click',()=>setLang('en'));

(function(){
 const linkmap={home:'index.html',life:'su-bida.html',work:'su-obra.html',bibliography:'catalogus.html#/bibliography',distribution:'catalogus.html#/distribution',research:'investigashon.html',sources:'catalogus.html#/sources',about:'tokante.html'};
 function adjust(){const nav=document.getElementById('navigation');if(!nav)return;
 for(const a of nav.querySelectorAll('a[href^="#/"]')){const key=a.getAttribute('href').slice(2).split('?')[0];if(linkmap[key])a.href=linkmap[key];}
 }
 document.addEventListener('DOMContentLoaded',()=>{adjust();const nav=document.getElementById('navigation');if(nav)new MutationObserver(adjust).observe(nav,{childList:true,subtree:true});});
})();

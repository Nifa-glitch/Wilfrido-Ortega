name: Synchronize CMS bibliography on test branch
on:
  push:
    branches: [cms-v16-preparation]
    paths:
      - 'cms-editable/**'
      - 'cms/bibliography/**'
      - 'scripts/sync_bibliography.py'
      - '.github/workflows/sync-cms-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate website bibliography
        run: |
          python scripts/sync_bibliography.py
          python scripts/sync_bibliography.py --write
          git diff --check
      - name: Validate generated Javascript and 212 records
        run: |
          node --check bibliography-data.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = {window:{}};
          vm.runInNewContext(fs.readFileSync('bibliography-data.js','utf8'),sandbox);
          const rows=sandbox.window.BIBLIOGRAPHY_RECORDS;
          if (!Array.isArray(rows)||rows.length!==212||new Set(rows.map(r=>r.id)).size!==212) throw Error('Invalid generated bibliography');
          const html=fs.readFileSync('catalogus.html','utf8');
          if (!html.includes('window.BIBLIOGRAPHY_RECORDS = ')) throw Error('Missing embedded bibliography');
          console.log('Validated 212 records and catalog bibliography assignment');
          JS
      - name: Commit test-branch generated files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography-data.js catalogus.html
          if ! git diff --cached --quiet; then
            git commit -m "Build test bibliography from CMS editable records"
            git push origin HEAD:cms-v16-preparation
          fi

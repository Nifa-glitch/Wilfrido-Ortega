name: Verify online preview setup
on:
  push:
    branches: [cms-v16-preparation]
    paths: ['package.json', '.github/workflows/verify-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx vite --version
      - run: test -f index.html && test -f catalogus.html

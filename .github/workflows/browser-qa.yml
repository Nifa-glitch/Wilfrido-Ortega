name: Browser smoke test on CMS branch
on:
  push:
    branches: [cms-v16-preparation]
    paths:
      - 'scripts/browser-smoke.cjs'
      - '.github/workflows/browser-qa.yml'
      - 'catalogus.html'
      - 'index.html'
      - 'app.js'
      - 'v16-visible-corrections.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Launch temporary local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/site-http.log 2>&1 &
          sleep 2
      - name: Check browser behavior
        run: node scripts/browser-smoke.cjs

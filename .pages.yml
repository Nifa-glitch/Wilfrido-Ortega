# Pages CMS safety pilot: only separate editable fields. Original 212 research records stay read-only.
media:
  input: cms/media
  output: /cms/media
content:
  - name: bibliography_editable
    label: Bibliografia — bewerkbare boeken (test)
    type: collection
    path: cms-editable
    format: json
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, year, genre, series]
      search: [title, series, year, genre]
    fields:
      - name: id
        label: Record-ID (vast)
        type: string
        readonly: true
      - name: title
        label: Titel
        type: string
        required: true
      - name: variant
        label: Titelvariant
        type: string
      - name: author
        label: Auteur
        type: string
      - name: series
        label: Serie
        type: string
      - name: volume
        label: Deel / tomo
        type: string
      - name: year
        label: Publicatiejaar
        type: string
      - name: genre
        label: Genre
        type: string
      - name: publisher
        label: Uitgever
        type: string
      - name: collection
        label: Collectie / vindplaats (redactionele toelichting)
        type: string
      - name: description
        label: Beschrijving
        type: text
      - name: image
        label: Omslagafbeelding
        type: image
      - name: research_note
        label: Onderzoeksnotitie
        type: text

  - name: portada_text
    label: Portada — tekst bewerken (pilot)
    type: file
    path: cms-pages/portada.json
    format: json
    fields:
      - name: pap_hero_intro
        label: Portada — introductie (Papiamentu)
        type: text
        required: true
      - name: en_hero_intro
        label: Portada — introduction (English)
        type: text
        required: true
      - name: pap_archive_heading
        label: Portada — archiefkop (Papiamentu)
        type: string
        required: true
      - name: en_archive_heading
        label: Portada — archive heading (English)
        type: string
        required: true
      - name: pap_destino_description
        label: Portada — Destino di Amor tekst (Papiamentu)
        type: text
        required: true
      - name: en_destino_description
        label: Portada — Destino di Amor text (English)
        type: text
        required: true

  - name: su_historia_text
    label: Su historia — tekst bewerken (pilot)
    type: file
    path: cms-pages/su-historia.json
    format: json
    fields:
      - name: pap_hero_lead
        label: Su historia — introductieregel (Papiamentu)
        type: text
        required: true
      - name: en_hero_lead
        label: Su historia — introductory line (English)
        type: text
        required: true

  - name: tokante_text
    label: Tokante — tekst bewerken (pilot)
    type: file
    path: cms-pages/tokante.json
    format: json
    fields:
      - name: pap_opening
        label: Tokante — introductie (Papiamentu)
        type: text
        required: true
      - name: en_opening
        label: Tokante — introduction (English)
        type: text
        required: true

  - name: su_produktividat_text
    label: Su produktividat — tekst bewerken (pilot)
    type: file
    path: cms-pages/su-produktividat.json
    format: json
    fields:
      - name: pap_intro_one
        label: Eerste alinea (Papiamentu)
        type: text
        required: true
      - name: pap_intro_two
        label: Tweede alinea (Papiamentu)
        type: text
        required: true
      - name: en_intro_one
        label: First paragraph (English)
        type: text
        required: true
      - name: en_intro_two
        label: Second paragraph (English)
        type: text
        required: true

  - name: investigashon_text
    label: Investigashon — tekst bewerken (pilot)
    type: file
    path: cms-pages/investigashon.json
    format: json
    fields:
      - name: pap_intro_one
        label: Eerste onderzoeksalinea (Papiamentu)
        type: text
        required: true
      - name: pap_intro_two
        label: Tweede onderzoeksalinea (Papiamentu)
        type: text
        required: true
      - name: en_intro_one
        label: First research paragraph (English)
        type: text
        required: true
      - name: en_intro_two
        label: Second research paragraph (English)
        type: text
        required: true

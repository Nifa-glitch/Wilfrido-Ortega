# Pages CMS safety pilot: only separate editable fields. Original 212 research records stay read-only.
media:
  input: cms/media
  output: /cms/media
content:
  - name: bibliography_diagnostic
    label: Bibliografia — diagnostische test (1 boek)
    type: file
    path: cms-editable/wo-record-0001.json
    format: json
    fields:
      - name: id
        label: Record-ID
        type: string
        readonly: true
      - name: title
        label: Titel
        type: string
      - name: year
        label: Publicatiejaar
        type: string

  - name: bibliography_collection_diagnostic
    label: Bibliografia — minimale collectietest
    type: collection
    path: cms-diagnostic
    format: json
    fields:
      - name: title
        type: string

  - name: bibliography_editable
    label: Bibliografia — bewerkbare boeken (test)
    type: collection
    path: cms-editable
    format: json
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, year, genre, series]
      search: [title, series, year, genre]
    fields:
      - name: id
        label: Record-ID (vast)
        type: string
        readonly: true
      - name: title
        label: Titel
        type: string
        required: true
      - name: variant
        label: Titelvariant
        type: string
      - name: author
        label: Auteur
        type: string
      - name: series
        label: Serie
        type: string
      - name: volume
        label: Deel / tomo
        type: string
      - name: year
        label: Publicatiejaar
        type: string
      - name: genre
        label: Genre
        type: string
      - name: publisher
        label: Uitgever
        type: string
      - name: collection
        label: Collectie / vindplaats (redactionele toelichting)
        type: string
      - name: description
        label: Beschrijving
        type: text
      - name: image
        label: Omslagafbeelding
        type: image
      - name: research_note
        label: Onderzoeksnotitie
        type: text

